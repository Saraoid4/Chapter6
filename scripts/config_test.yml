    distribution: uniform
    low: 10
    high: 1000
    log: false
  snr:
    distribution: uniform
    low: 5
    high: 100
    log: false
  width_s:
    distribution: loguniform
    mu: -6.9
    sigma: 1
    log: true
  scat_s:
    distribution: loguniform
    mu: -4.6
    sigma: 1
    log: true
  spec_id:
    distribution: uniform
    low: -4
    high: 4
    log: false